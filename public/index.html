<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Superhero Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="halftone" aria-hidden="true"></div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 4h34v25l-9 7H3z" fill="#ff3d83"/><path d="M23 6 11 22h8l-3 12 14-18h-9z" fill="#0b0d1d"/></svg>
        <div>
          <h1>Superhero <em>Maker</em></h1>
          <p>Build a hero. Forge the image.</p>
        </div>
      </div>
      <button class="icon-btn" id="openSettings" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      </button>
    </header>

    <nav class="steps" id="steps" aria-label="Progress"></nav>

    <div class="layout">
      <aside class="sheet" id="sheet" aria-label="Hero sheet"></aside>
      <main id="screen"></main>
    </div>
  </div>

  <div class="dock">
    <div class="dock-in">
      <button class="btn" id="back" type="button">Back</button>
      <div class="dock-mid" id="dockMid"></div>
      <button class="btn primary" id="next" type="button">Next</button>
    </div>
  </div>

  <div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="scrim" id="scrim"></div>
    <div class="drawer-in" id="drawerIn"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
